<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
     <meta http-equiv="Content-Security-Policy" content="@rotor:csp">
    <meta name="theme-color" content="#6a5cff">
    <title>Rotor</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>/*@rotor:css*/</style>
</head>
<body>
<header>
    <nav id="menubar" class="menubar" role="menubar" aria-label="Main menu"></nav>
    <span class="sep" aria-hidden="true">·</span>
    <span id="docTitle" class="title" title="Notebook title — double-click to rename"></span>
    <span id="viewName" class="muted"></span>
    <span class="spacer"></span>
    <input id="search" placeholder="Search notes" aria-label="Search notes">
    <input id="importFile" type="file" accept=".rotor,.json,application/json,application/vnd.rotor+json" hidden>
</header>
<div class="shelves" id="shelves"></div>
<div id="driveBanner" class="drive-banner" role="status" hidden>
     <span id="driveMsg"></span>
     <button id="driveConnect" class="primary" type="button">Connect Google Drive</button>
</div>
<main>
    <div id="gridwrap">
        <table id="grid" role="grid"></table>
    </div>
    <aside id="editor" aria-label="Item editor"></aside>
</main>
<footer>
    <input id="capture" placeholder="Quick capture (N) — e.g. Call Bob topic:finance status:open"
           aria-label="Quick capture">
    <span class="hint" aria-hidden="true"><kbd>/</kbd> commands · <kbd>N</kbd> capture · <kbd>⌘T</kbd> rotate</span>
    <span id="status" class="muted"></span>
</footer>
<div id="live" class="sr" aria-live="polite"></div>
<div id="palette" role="dialog" aria-label="Command palette">
    <div class="box">
        <input id="palIn" placeholder="Type a command — e.g. rows topic, filter status open, save" aria-label="Command">
        <ul id="palList" role="listbox"></ul>
    </div>
</div>
<div id="agents" role="dialog" aria-label="Agents" aria-modal="true">
     <div class="box" id="agentsBox"></div>
</div>
<script type="application/json" id="rotor-data"></script>
<script>/*@rotor:js*/</script>
</body>
</html>

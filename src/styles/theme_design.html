    "summary": "### Audit Summary\n\n- **Files scanned (18):** `src/styles/index.css`, `tokens.css`, `base.css`, `bars.css`, `brand.css`, `controls.css`, `shelves.css`, `grid.css`, `cards.css`, `editor.css`, `footer.css`, `palette.css`, `agents.css`, `locks.css`, `contextmenu.css`, `menubar.css`, `drive.css`, `milkdown.css`, `motion.css`, `luminous.css`.\n- **Colour literals extracted:** 54 literal occurrences across `:root`, `@media (prefers-color-scheme: dark)`, component rules, and SVG data URLs.\n- **Distinct colour clusters (ΔE_ok ≤ 0.02):** 18 opaque base clusters (9 paired light/dark tokens + 2 shared spectrum constants) plus translucent glass/line/shadow overlays.\n- **Themes found:** 2 (`light` on `:root` and `dark` via `@media (prefers-color-scheme: dark)` in `tokens.css` and `luminous.css`).\n- **Exported tokens defined:** 10 (`canvas`, `surface1`, `text`, `textMuted`, `brand`, `accentCyan`, `accentPink`, `danger`, `accentMint`, `accentGold`).\n- **Accessibility findings:**\n  1. Light theme `--danger` (`#e5484d`) on `--solid` (`#ffffff`) has a contrast ratio of **3.91:1**, passing UI/large-text AA (3:1) but falling short of 4.5:1 small-text AA when used for `.ctxmenu button.danger`.\n  2. Light theme `--acc` (`#6a5cff`) on `--solid` (`#ffffff`) has a contrast ratio of **4.37:1** (0.13 below the 4.5:1 AA threshold for body-sized links `a { color: var(--acc) }` and `.card .prov`).\n  3. `--mut` (`#697092`) on `--bg` (`#f4f5fb`) achieves **4.53:1** (passes AA) and on `--solid` (`#ffffff`) achieves **4.92:1**.",
    "replacements": "### Token Replacements\n\nMap the legacy shorthand custom properties in `src/styles/tokens.css` and hard-coded literals in `agents.css`, `shelves.css`, and `luminous.css` to the solved `--color-*` tokens:\n\n| Existing CSS variable / literal | New Point-CAD token | Role & Usage |\n|---|---|---|\n| `--bg` (`#f4f5fb` / `#06070e`) | `var(--color-canvas)` | Page background (`body`) and modal backdrop mixes |\n| `--solid` (`#ffffff` / `#13162a`) | `var(--color-surface-1)` | Opaque cards, inputs, table headers, popovers, Milkdown surface |\n| `--fg` (`#151a2d` / `#e9ebf8`) | `var(--color-text)` | Primary body and control foreground |\n| `--mut` (`#697092` / `#8a90b3`) | `var(--color-text-muted)` | Secondary labels, table counts, kbd hints, icons |\n| `--acc` (`#6a5cff` / `#8f84ff`) | `var(--color-brand)` | Primary electric-violet brand accent, links, focus rings |\n| `--acc2` (`#00b6ff` / `#3dd3ff`) | `var(--color-accent-cyan)` | Secondary cyan stop in gradients, aurora, and hover glows |\n| `--acc3` (`#ff4f9f` / `#ff6fbf`) | `var(--color-accent-pink)` | Tertiary magenta-pink stop in gradients and aurora |\n| `--danger` (`#e5484d` / `#ff6369`) | `var(--color-danger)` | Destructive actions, `<del>` diffs, exclude filter tokens |\n| `#2fe6b7` (`agents.css`, `shelves.css`, `luminous.css`) | `var(--color-accent-mint)` | `<ins>` diffs, `.ai-conn.ok`, `.ftok.include`, `--spectrum` stop |\n| `#ffc861` (`luminous.css`) | `var(--color-accent-gold)` | Warm gold stop in `--spectrum` conic gradients |",
    "plumbing": "### Theme Plumbing (`tokens.css`)\n\nImport `rotor-tokens.css` at the top of `src/styles/index.css` (or inline its `:root`, `@media (prefers-color-scheme: dark)`, and `[data-theme]` blocks into `src/styles/tokens.css`).\n\nTo preserve 100% backwards compatibility with all 17 component stylesheets without editing every `var(--acc)` call immediately, alias the existing variables in `src/styles/tokens.css` to the solved Point-CAD tokens:\n\n```css\n:root {\n    --bg: var(--color-canvas);\n    --fg: var(--color-text);\n    --mut: var(--color-text-muted);\n    --solid: var(--color-surface-1);\n    --acc: var(--color-brand);\n    --acc2: var(--color-accent-cyan);\n    --acc3: var(--color-accent-pink);\n    --danger: var(--color-danger);\n}\n```\n\nAnd replace the raw hex literals in:\n- `src/styles/agents.css` (`#2fe6b7` → `var(--color-accent-mint)`)\n- `src/styles/shelves.css` (`#2fe6b7` → `var(--color-accent-mint)`)\n- `src/styles/luminous.css` (`#2fe6b7` → `var(--color-accent-mint)`, `#ffc861` → `var(--color-accent-gold)`)",
    "alpha": "### Alpha & Translucent Surfaces (`color-mix`)\n\nRotor already uses `color-mix(in oklab, …)` extensively across its stylesheets. The remaining hard-coded `rgba(…)` tokens in `tokens.css` and `luminous.css` can be expressed directly against the solved tokens so they automatically adapt to any theme:\n\n```css\n:root {\n    --line: color-mix(in oklab, var(--color-text) 7%, transparent);\n    --line2: color-mix(in oklab, var(--color-text) 13%, transparent);\n    --card: color-mix(in oklab, var(--color-surface-1) 74%, transparent);\n    --glass: color-mix(in oklab, var(--color-surface-1) 58%, transparent);\n    --echo: color-mix(in oklab, var(--color-brand) 8%, transparent);\n}\n```",

    "order": "### Recommended Migration Order\n\n1. **Generate & import `rotor-tokens.css`** from this harness and import it first in `src/styles/index.css`.\n2. **Update `src/styles/tokens.css`** so `--bg`, `--fg`, `--mut`, `--solid`, `--acc`, `--acc2`, `--acc3`, and `--danger` alias the `--color-*` custom properties.\n3. **Replace raw hex literals** `#2fe6b7` and `#ffc861` in `agents.css`, `shelves.css`, and `luminous.css` with `var(--color-accent-mint)` and `var(--color-accent-gold)`.\n4. **Verify contrast floors** in light mode if strict WCAG AA (4.5:1) is required on `a { color: var(--color-brand) }` and `.ctxmenu button.danger` (see Findings).",
    "findings": "### Findings & Open Questions\n\n1. **Primary Brand Link Contrast (`--acc` on `--solid` in Light Mode):**\n   - Observed light `--acc` (`#6a5cff`, `oklch(58.299% 0.23676 282.58)`) against `#ffffff` yields **4.37:1** (and **3.97:1** against `--bg` `#f4f5fb`). While suitable for UI accents, badges, and gradients, `cards.css` sets `a { color: var(--acc) }` and `agents.css` sets `.card .prov { color: var(--acc) }`. Lowering `brand` lightness by `ΔL = -0.015` (to `L ≈ 56.8%`) brings it across the 4.5:1 AA floor.\n2. **Destructive Action Contrast (`--danger` on `--solid` in Light Mode):**\n   - Observed light `--danger` (`#e5484d`, `oklch(61.868% 0.20728 24.16)`) has **3.91:1** contrast on `#ffffff` (`3.55:1` on `#f4f5fb`). In `contextmenu.css` (`.ctxmenu button.danger`) and `editor.css` (`#editorBody > div:first-child button:last-child`), it styles 13.5px button text. The sketch enforces `contrast danger surface1 >= 3.5` to stay faithful to `#e5484d`; raise this constraint to `>= 4.5` if strict small-text AA is desired.\n3. **Unified Indigo-Slate Reading Axis (`readingGray`):**\n   - Both `--fg` (`#151a2d`, `H = 275.62°`, `C = 0.04724`) and `--mut` (`#697092`, `H = 275.47°`, `C = 0.05264`) in light mode, as well as `--fg` (`#e9ebf8`, `H = 276.96°`) and `--mut` (`#8a90b3`, `H = 276.43°`, `C = 0.05269`) in dark mode, lie along a tight `275.5°–276.9°` indigo-slate hue axis (`ΔH < 1.5°`). Using the `readingGray` orientation point locks `H` and `C` across the text family.\n4. **Shared Spectrum Accents (`#2fe6b7` & `#ffc861`):**\n   - `#2fe6b7` (mint, used for positive diffs, `.ai-ok`, `.ftok.include`, and `--spectrum`) and `#ffc861` (warm gold in `--spectrum`) were hard-coded outside `tokens.css`. Promoting them to `accentMint` and `accentGold` with `shared` chroma unifies all status and spectrum colours.",
